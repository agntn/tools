packages:
  - docs

gitChecks: false

allowBuilds:
  "@google/genai": false
  better-sqlite3: true
  core-js-pure: false
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  vue-demi: true
  workerd: true

minimumReleaseAgeExclude:
  # Our own packages: a clean install would refuse a sibling released a few hours ago.
  - "@agntn/*"
  - "@oh-my-pi/hashline@18.0.0"
  - "@oh-my-pi/omp-stats@18.0.0"
  - "@oh-my-pi/omptype@18.0.0"
  - "@oh-my-pi/pi-agent-core@18.0.0"
  - "@oh-my-pi/pi-ai@18.0.0"
  - "@oh-my-pi/pi-catalog@18.0.0"
  - "@oh-my-pi/pi-coding-agent@18.0.0"
  - "@oh-my-pi/pi-mnemopi@18.0.0"
  - "@oh-my-pi/pi-natives-darwin-arm64@18.0.0"
  - "@oh-my-pi/pi-natives-darwin-x64@18.0.0"
  - "@oh-my-pi/pi-natives-linux-arm64@18.0.0"
  - "@oh-my-pi/pi-natives-linux-x64@18.0.0"
  - "@oh-my-pi/pi-natives-win32-x64@18.0.0"
  - "@oh-my-pi/pi-natives@18.0.0"
  - "@oh-my-pi/pi-tui@18.0.0"
  - "@oh-my-pi/pi-utils@18.0.0"
  - "@oh-my-pi/pi-wire@18.0.0"
  - "@oh-my-pi/snapcompact@18.0.0"
  - "@voidzero-dev/vite-plus-core@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0"
  - vite-plus@1.0.0

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

# One version per name for the library and docs/, which bundles the library from ../src.
catalogs:
  deps:
    "@modelcontextprotocol/client": 2.4.0
    "@modelcontextprotocol/sdk": 1.32.1
    "@vueuse/core": 14.4.0
    agents: 0.32.0
    ai: 7.0.127
    better-sqlite3: 12.11.1
    docus: 5.15.0
    nuxt: 4.6.3
    ufo: 1.6.4
  dev:
    "@agntn/ox": 0.1.0
    "@earendil-works/pi-coding-agent": 1.0.4
    "@iconify-json/lucide": 1.2.151
    "@iconify-json/simple-icons": 1.2.101
    "@iconify-json/vscode-icons": 1.2.96
    "@modelcontextprotocol/server": 2.4.0
    "@nuxt/content": 3.16.1
    "@nuxt/ui": 4.12.0
    "@oh-my-pi/pi-coding-agent": 18.18.8
    "@types/node": 26.6.6
    h3: 2.0.1
    h3-mcp: 0.2.0
    obuild: 0.4.43
    shiki: 4.5.0
    typebox: 1.4.3
    typescript: 7.0.2
    wrangler: 4.156.0
    zod: 4.6.5
  # Docus's i18n plugin parses through @typescript-eslint, and TypeScript 7 has no JS API for it.
  nuxt:
    typescript: 5.9.3

cleanupUnusedCatalogs: true

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# 0.28.6 breaks three TypeBox shapes in the bundled types (one is sxzz/rolldown-plugin-dts#307).
# Drop or move the patch only once upstream fixes all three; `pnpm typecheck:dist` shows them.
patchedDependencies:
  rolldown-plugin-dts@0.28.6: patches/rolldown-plugin-dts@0.28.6.patch

# Keeps pnpm 12's env document out of the lockfile. GitHub reads that one as zero dependencies.
pmOnFail: ignore
